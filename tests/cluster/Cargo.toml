[package]
name = "sovereign-cluster-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
sovereign-consensus = { path = "../../crates/consensus" }
sovereign-identity = { path = "../../crates/identity" }
sovereign-crypto = { path = "../../crates/crypto" }
sovereign-ssz = { path = "../../crates/sovereign-ssz" }
sovereign-iggy-ctrl = { path = "../../crates/iggy-ctrl" }
