tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
k256 = "0.14"
bs58 = "0.5"
reqwest = { version = "0.12", features = ["json"] }
eyre = "0.6"
alloy-consensus = { workspace = true }
