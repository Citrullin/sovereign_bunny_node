apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-koral-sigstore-images
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-sigstore-signature
      match:
        any:
        - resources:
            kinds:
              - Pod
      verifyImages:
        - imageReferences:
            - "ghcr.io/sovereign-reth/*"
            - "localhost/bunny-*"
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/sovereign-reth/sovereign-reth/.github/workflows/*"
          mutateDigest: true
          verifyDigest: true
          required: false
