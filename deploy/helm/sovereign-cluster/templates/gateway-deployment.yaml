apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: bunny-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: bunny-gateway
  template:
    metadata:
      labels:
        app: bunny-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.service.httpPort }}
              name: http
            - containerPort: {{ .Values.gateway.service.sszPort }}
              name: ssz
          env:
            - name: RUST_LOG
              value: "info"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.gateway.service.sszPort }}
      targetPort: ssz
      name: ssz
  selector:
    app: bunny-gateway
