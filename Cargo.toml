[workspace]
members = [
    "crates/node",
    "crates/consensus",
    "crates/attestation",
    "crates/identity",
    "crates/network",
    "crates/crypto",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Citrullin"]

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
alloy-primitives = { version = "=1.6.0", features = ["serde"] }
alloy-consensus = "2.1.1"
alloy-eips = "2.1.1"
revm-primitives = "41.0.0"
revm-state = "41.0.0"
revm-bytecode = "41.0.0"
revm-database-interface = "41.0.0"

# Reth dependencies
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0", features = ["node", "pool", "node-api", "cli", "provider"] }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0", features = ["test-utils"] }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-primitives-traits = "0.5.0"
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.0" }

# Ecosystem dependencies
did-peer = "0.7.5"
k256 = "0.14.0"
ed25519-dalek = "3.0.0"
boringtun = "0.7.1"
nmt-rs = "0.2.5"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
siwe = "0.6.1"
reed-solomon-erasure = "6.0.0"
dcap-qvl = "0.5.2"
toml = "0.8"
scale = { package = "parity-scale-codec", version = "3.6", default-features = false }
base64 = "0.22"
bs58 = "0.5"
blake3 = "1.5"
fips204 = "0.4"
fips205 = "0.4"
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3.5"
light-poseidon = "0.4.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-serialize = "0.5.0"




# Local Workspace dependencies
sovereign-consensus = { path = "crates/consensus" }
sovereign-attestation = { path = "crates/attestation" }
sovereign-identity = { path = "crates/identity" }
sovereign-network = { path = "crates/network" }

[profile.dev]
debug = 0
strip = true
codegen-units = 1
incremental = false

[profile.test]
debug = 0
strip = true
codegen-units = 1
incremental = false

[profile.release]
opt-level = 0
codegen-units = 1
panic = "abort"
strip = true
lto = false
incremental = false

