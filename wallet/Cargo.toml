[package]
name = "sovereign-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2.17", features = ["js"] }
getrandom_v3 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_v4 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
alloy-primitives = { version = "=1.6.0", features = ["serde"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
ed25519-dalek = "2.2.0"
bs58 = "0.5"
aes-gcm = "0.10"
argon2 = "0.5"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
resvg = "0.37"
tiny-skia = "0.11"
fips204 = "0.4"
fips205 = "0.4"
scale = { package = "parity-scale-codec", version = "3.6", default-features = false, features = ["derive"] }
alloy-consensus = "2.1.1"
alloy-signer-local = "2.1.1"
alloy-network = "2.1.1"
alloy-rlp = "0.3"
bip32 = "0.5.1"

[dependencies.web-sys]
version = "0.3.103"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "console"
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
